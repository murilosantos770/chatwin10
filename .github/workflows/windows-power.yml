name: Windows Power Test

on:
  workflow_dispatch:

jobs:
  power-test:
    runs-on: windows-latest

    steps:
      - name: Mostrar hardware
        shell: powershell
        run: |
          Write-Host "===== WINDOWS ====="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "`n===== CPU ====="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "`n===== RAM ====="
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("{0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB))

          Write-Host "`n===== DISCO ====="
          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" |
            Select-Object DeviceID,
              @{Name="TotalGB";Expression={[math]::Round($_.Size / 1GB, 2)}},
              @{Name="LivreGB";Expression={[math]::Round($_.FreeSpace / 1GB, 2)}}

      - name: Teste de CPU
        shell: powershell
        run: |
          $cores = [Environment]::ProcessorCount

          Write-Host "Threads disponíveis: $cores"

          $jobs = @()

          for ($i = 0; $i -lt $cores; $i++) {
            $jobs += Start-Job {
              $total = 0
              for ($n = 0; $n -lt 5000000; $n++) {
                $total += $n
              }
              $total
            }
          }

          $jobs | Wait-Job | Out-Null
          $jobs | Receive-Job | Out-Null
          $jobs | Remove-Job

          Write-Host "Teste concluído."

      - name: Final
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================"
          Write-Host "   WINDOWS POWER TEST OK"
          Write-Host "================================"
